modelRoles:
  default: litellm/claude-sonnet-5
  smol: litellm/gemini-3.5-flash-lite:auto
  tiny: litellm/mistral-ministral
  slow: litellm/claude-opus-5-5
  plan: litellm/qwen3.8-27b
  vision: litellm/sensenova-6.8-flash-lite:auto
  task: litellm/claude-haiku-5-5
  advisor: litellm/agnes-2.5-flash
cycleOrder:
  - smol
  - default
  - slow
  - vision
  - tiny
retry:
  modelFallback: true
  waitForUsageReset: true
  fallbackChains:
    default:
      - litellm/claude-opus-5-5
    slow:
      - litellm/claude-sonnet-5
    vision:
      - litellm/gemini-3.5-flash-lite
    task:
      - litellm/sensenova-6.8-flash-lite
    tiny:
      - litellm/gemini-3.5-flash-lite
    advisor:
      - litellm/claude-sonnet-5
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 2
memory:
  backend: mnemopi
  scoping: per-project
defaultThinkingLevel: medium
