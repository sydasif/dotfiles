modelRoles:
  default: litellm/claude-sonnet-5:medium
  smol: litellm/mistral-14b-latest
  slow: litellm/claude-opus-5-5:medium
  vision: litellm/claude-haiku-5-5:medium
  advisor: litellm/agnes-2.5-flash
cycleOrder:
  - smol
  - slow
  - default
  - vision
retry:
  modelFallback: true
  fallbackChains:
    default:
      - litellm/claude-opus-5-5
    slow:
      - litellm/claude-sonnet-5
    smol:
      - litellm/claude-haiku-5-5
    advisor:
      - litellm/mistral-14b-latest
  fallbackRevertPolicy: cooldown-expiry
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 4
advisor:
  enabled: true
memory:
  backend: mnemopi
  scoping: per-project
update:
  auto: true
