modelRoles:
  default: litellm/claude-sonnet-5
  slow: litellm/claude-opus-5-5
  vision: litellm/qwen3.8-27b
  tiny: litellm/claude-haiku-5-5
  advisor: litellm/gemini-3.5-flash-lite:auto
cycleOrder:
  - slow
  - default
  - tiny
  - vision
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - litellm/claude-opus-5-5
      - litellm/claude-haiku-5-5
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 2
memory:
  backend: mnemopi
  scoping: per-project
