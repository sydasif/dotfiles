modelRoles:
  default: litellm/claude-sonnet-5
  slow: litellm/claude-opus-5-5
  vision: litellm/claude-haiku-5-5
  tiny: litellm/mistral-14b-latest
  advisor: litellm/mistral-14b-latest

cycleOrder:
  - slow
  - default
  - tiny
  - vision

retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - litellm/claude-opus-5-5
      - litellm/claude-haiku-5-5
      - litellm/mistral-14b-latest

symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 2
advisor:
  enabled: true
memory:
  backend: mnemopi
  scoping: per-project
