modelRoles:
  default: litellm/claude-sonnet-5
  smol: litellm/gemini-3.5-flash-lite:auto
  slow: litellm/claude-opus-5-5
  plan: litellm/claude-opus-5-5
  vision: litellm/sensenova-6.8-flash-lite
  commit: litellm/claude-haiku-5-5
  task: litellm/claude-haiku-5-5
  advisor: litellm/claude-opus-5-5
  tiny: litellm/gemini-3.5-flash-lite:auto
  memory: litellm/claude-haiku-5-5
  widget: litellm/gemini-3.5-flash-lite:auto

cycleOrder:
  - plan
  - default
  - task
  - vision
  - tiny

retry:
  modelFallback: true
  waitForUsageReset: true
  fallbackChains:
    default:
      - litellm/claude-sonnet-5
      - litellm/claude-haiku-5-5
    slow:
      - litellm/claude-opus-5-5
      - litellm/claude-sonnet-5
    plan:
      - litellm/claude-opus-5-5
      - litellm/claude-sonnet-5
    vision:
      - litellm/sensenova-6.8-flash-lite
      - litellm/gemini-3.5-flash-lite:auto
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 2
memory:
  backend: mnemopi
  scoping: per-project

