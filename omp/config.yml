modelRoles:
  default: litellm/claude-sonnet-5
  smol: litellm/gemini-3.5-flash-lite:auto
  slow: litellm/claude-opus-5-5
  vision: litellm/sensenova-6.8-flash-lite
  plan: litellm/qwen3.8-27b
  tiny: litellm/claude-haiku-5-5
  advisor: litellm/claude-opus-5-5
cycleOrder:
  - smol
  - default
  - slow
  - tiny
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - litellm/claude-opus-5-5
    slow:
      - litellm/claude-sonnet-5
    smol:
      - litellm/claude-haiku-5-5
    advisor:
      - litellm/sensenova-6.8-flash-lite
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 2
memory:
  backend: mnemopi
  scoping: per-project
